<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt - SHANKS SHOP MANAGEMENT</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.png" type="image/png" sizes="512x512">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="api.js"></script>
<script src="common.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{--primary:#10b981;--primary-hover:#059669;--primary-soft:#ecfdf5;--primary-ring:rgba(16,185,129,0.15);--danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;--dark:#111827;--dark-2:#1f2937;--border:#e5e7eb;--light:#f9fafb;--text:#111827;--text-soft:#64748b;--success:#10b981;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif;}
body{background:#f3f4f6;min-height:100vh;}
.sidebar{width:260px;background:var(--dark);color:#fff;height:100vh;overflow-y:auto;flex-shrink:0;transition:all 0.3s;}
.sidebar-header{padding:20px;background:#020617;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-header h1{font-size:20px;color:var(--primary);margin:0;font-weight:900;}
.sidebar-header p{font-size:12px;color:#94a3b8;margin-top:4px;}
.sidebar ul{list-style:none;padding:12px 0;}
.sidebar ul li{padding:12px 22px;display:flex;align-items:center;gap:12px;cursor:pointer;border-left:3px solid transparent;transition:all 0.2s;font-size:14px;}
.sidebar ul li:hover{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--primary);}
.sidebar ul li.active{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--primary);}
.main{flex:1;padding:24px;overflow-y:auto;min-width:0;}
.header{background:#fff;color:var(--text);padding:16px 24px;border-radius:12px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--border);}
.header h2{font-size:18px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px;}
.header h2 i{color:var(--primary);}
.header-actions{display:flex;gap:8px;align-items:center;}
.header-clock{font-size:13px;font-weight:600;color:var(--text-soft);white-space:nowrap;}
.user-menu{position:relative;cursor:pointer;padding:7px 12px;border-radius:8px;background:var(--light);display:flex;align-items:center;gap:6px;}
.user-dropdown{position:absolute;top:100%;right:0;margin-top:6px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 25px rgba(0,0,0,.12);min-width:220px;z-index:1000;display:none;padding:6px;}
.user-dropdown.show{display:block;}
.user-info{padding:6px 0 10px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.user-info strong{color:var(--text);}
.user-dropdown a{display:flex;align-items:center;gap:10px;padding:9px 12px;color:var(--text-soft);text-decoration:none;border-radius:8px;transition:background .2s;font-size:13px;}
.user-dropdown a:hover{background:var(--primary-soft);color:var(--primary-dark,#059669);}
.page-title{font-size:20px;font-weight:800;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.page-title i{color:var(--primary);}
.receipt-container{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
.receipt-card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--border);overflow:hidden;transition:box-shadow .2s,border-color .2s;}
.receipt-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.06);}
.receipt-header{background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:26px;text-align:center;position:relative;}
.receipt-logo{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 14px;background:#fff;border-radius:14px;padding:7px;box-shadow:0 8px 20px rgba(0,0,0,.2);}
.receipt-header h1{font-size:24px;font-weight:900;margin:0;letter-spacing:.5px;text-transform:uppercase;}
.receipt-header p{margin:4px 0 0;opacity:.95;font-size:14px;}
.qr-code{position:absolute;top:22px;right:22px;width:92px;height:92px;background:#fff;border-radius:12px;padding:9px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.18);border:1px solid var(--border);}
.qr-code canvas{width:100%;height:100%;}
.qr-label{font-size:9px;color:var(--text-soft);text-align:center;margin-top:6px;letter-spacing:.3px;}
.receipt-body{padding:26px;}
.receipt-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.receipt-meta-box{background:var(--light);border:1px solid var(--border);border-radius:12px;padding:14px;transition:transform .1s;}
.receipt-meta-box:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.04);}
.receipt-meta-box .label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-soft);margin-bottom:6px;}
.receipt-meta-box .value{font-size:15px;font-weight:800;color:var(--text);word-break:break-word;}
.loyalty-badge{display:inline-flex;align-items:center;gap:7px;background:#dcfce7;border:1px solid #86efac;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;color:#15803d;display:none;}
.loyalty-badge.show{display:inline-flex;}
.loyalty-badge .pts{font-weight:900;color:#16a34a;}
.receipt-items{margin-bottom:22px;}
.receipt-items h3{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-soft);margin-bottom:10px;}
.items-table{width:100%;border-collapse:collapse;}
.items-table th{background:#f8fafc;text-align:left;padding:13px 14px;font-size:12px;font-weight:800;text-transform:uppercase;color:#334155;border-bottom:2px solid var(--border);}
.items-table td{padding:13px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
.items-table tr:last-child td{border-bottom:none;}
.items-table tr:hover td{background:#fefefe;}
.items-table .col-name{font-weight:600;color:var(--text);}
.items-table .col-qty{text-align:center;color:var(--text-soft);font-variant-numeric:tabular-nums;font-weight:700;}
.items-table .col-price{text-align:right;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;}
.items-table .col-total{text-align:right;font-weight:800;color:var(--text);}
.items-table .col-pkg{text-align:center;color:var(--text-soft);font-size:11px;}
.receipt-totals{background:var(--light);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:22px;}
.total-row{display:flex;justify-content:space-between;padding:9px 0;font-size:14px;color:var(--text);border-bottom:1px solid var(--border);}
.total-row:last-child{border-bottom:none;}
.total-row.grand-total{font-size:18px;font-weight:900;color:var(--text);border-top:2px solid var(--border);border-bottom:2px solid var(--border);padding-top:13px;padding-bottom:13px;margin-top:10px;}
.total-row .label{color:var(--text-soft);font-weight:600;}
.total-row .value{font-weight:700;}
.total-row.grand-total .value{color:#10b981;}
.total-row.payment{color:var(--info);}
.total-row.cash{color:var(--primary);}
.total-row.account{color:#dc2626;}
.total-row.change{color:var(--warning);}
.split-payments{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.split-payments .label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-soft);margin-bottom:8px;}
.split-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px;}
.comment-box{background:#fffbeb;border:1px solid #fef3c7;border-radius:10px;padding:14px;margin-bottom:18px;font-size:13px;color:#92400e;}
.comment-box strong{color:#a16207;}
.receipt-footer{border-top:2px dashed var(--border);padding-top:18px;text-align:center;}
.receipt-footer .footer-text{font-size:14px;color:var(--text-soft);line-height:1.7;font-weight:600;}
.receipt-footer .footer-notes{font-size:12px;color:#94a3b8;margin-top:8px;}
.signature-section{margin-top:16px;padding:16px;background:#f8fafc;border:1px solid var(--border);border-radius:12px;}
.signature-section .label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-soft);margin-bottom:8px;}
.signature-canvas{border:2px dashed var(--border);border-radius:10px;background:#fff;width:100%;height:150px;cursor:crosshair;position:relative;margin-bottom:10px;}
.signature-canvas canvas{width:100%;height:100%;border-radius:8px;cursor:crosshair;}
.signature-canvas .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-soft);font-size:14px;pointer-events:none;}
.signature-actions{display:flex;gap:8px;}
.actions-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
.actions-bar .btn{flex:1;min-width:150px;padding:13px 16px;border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;}
.btn-primary{background:var(--primary);}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 8px 20px rgba(16,185,129,.3);}
.btn-outline{background:#fff;color:var(--text);border:1px solid var(--border);}
.btn-outline:hover{background:var(--light);transform:translateY(-1px);}
.btn-danger{background:var(--danger);}
.btn-danger:hover{background:#dc2626;transform:translateY(-1px);box-shadow:0 8px 20px rgba(239,68,68,.3);}
.btn-edit{background:var(--info);}
.btn-edit:hover{background:#2563eb;transform:translateY(-1px);box-shadow:0 8px 20px rgba(59,130,246,.3);}
.btn-warning{background:var(--warning);}
.btn-warning:hover{background:#d97706;transform:translateY(-1px);box-shadow:0 8px 20px rgba(245,158,11,.3);}
.btn-return{background:#7c3aed;}
.btn-return:hover{background:#6b21a8;transform:translateY(-1px);box-shadow:0 8px 20px rgba(124,58,237,.3);}
.no-receipt{text-align:center;padding:90px 20px;color:var(--text-soft);}
.no-receipt i{font-size:64px;color:#d1d5db;margin-bottom:24px;display:block;}
.no-receipt h3{font-size:22px;margin-bottom:10px;color:var(--text);}
.no-receipt p{font-size:15px;max-width:440px;margin:0 auto 30px;line-height:1.6;}
.no-receipt-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.void-badge{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:12px;padding:14px;margin-bottom:16px;text-align:center;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.5px;}
.returned-badge{background:#fffbeb;color:#92400e;border:1px solid #fde68a;border-radius:12px;padding:14px;margin-bottom:16px;text-align:center;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.5px;}
.section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-soft);margin-bottom:8px;display:block;}
.templates-bar{margin-bottom:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.template-btn{padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12px;cursor:pointer;color:var(--text-soft);font-weight:600;}
.template-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.template-btn:hover{background:var(--light);}
.template-thermal .receipt-header{background:linear-gradient(135deg,#10b981,#059669)!important;color:#fff!important;}
.template-thermal .receipt-card{border:2px solid #10b981;}
.template-invoice .receipt-header{background:#fff!important;color:var(--text)!important;border-bottom:3px double #000;padding:22px;}
.template-invoice .receipt-logo{border:2px solid #000;box-shadow:none;}
.template-invoice .receipt-meta-box{background:#fff!important;border:2px solid #000;}
.template-invoice .items-table th{background:#000!important;color:#fff!important;}
.template-invoice .receipt-totals{background:#fff!important;border:2px solid #000;}
.template-a4 .receipt-card{box-shadow:none;border:1px solid #ccc;}
.template-a4 .receipt-header{background:#f8fafc!important;color:var(--text)!important;border-bottom:2px solid #64748b;}
.template-a4 .receipt-meta{grid-template-columns:2fr 1fr 1fr 1fr;}
.template-a4 .items-table th{background:#e2e8f0!important;}
@media(max-width:768px){.sidebar{position:fixed;top:0;left:0;z-index:2500;height:100%;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 50px rgba(0,0,0,.45)}.sidebar.open{transform:translateX(0)}.sidebar-toggle{display:inline-flex}.receipt-meta{grid-template-columns:1fr;}.actions-bar{flex-direction:column;}.actions-bar .btn{min-width:auto;width:100%;}.header{flex-direction:column;gap:12px;align-items:flex-start;}.header-actions{width:100%;justify-content:flex-end;}.qr-code{position:static;width:100px;height:100px;margin:0 auto 14px;}}
@media print{body{background:#fff;}.sidebar,.header,.actions-bar,.templates-bar,.signature-section,.signature-actions,.no-receipt,.no-receipt-actions,.button-hidden{display:none!important;}.main{padding:0;margin:0;}.receipt-container{max-width:100%;}.receipt-card{border:none;box-shadow:none;border-radius:0;padding:0;}.receipt-header{background:#10b981;-webkit-print-color-adjust:exact;color-adjust:exact;}.receipt-body{padding:20px;}.receipt-meta{grid-template-columns:2fr 1fr 1fr 1fr;margin-bottom:16px;}.items-table td{font-size:12px;padding:8px 6px;}.total-row{font-size:12.5px;padding:6px 0;}.total-row.grand-total{font-size:16px;padding-top:10px;padding-bottom:10px;}.signature-canvas{border-color:#000;}}
</style>
</head>
<body>
<div class="sidebar" id="sidebar"></div>
<div class="main-content">
<div class="header">
  <h2><i class="fas fa-receipt"></i> Receipt</h2>
  <div class="header-actions">
    <div class="header-clock" id="topClock"></div>
    <div id="userMenu"></div>
  </div>
</div>
<div class="main">
  <div class="receipt-container" id="receiptContainer"></div>
</div>
<div class="toast" id="toast"></div>

<script>
var currentReceipt = null;
var currentSaleId = null;
var signatureData = null;
var canvas = null;
var ctx = null;
var isDrawing = false;
function $(id){return document.getElementById(id);}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function fmt(n){try{return StoreConfig.formatCurrency(n);}catch(e){return '₦'+(parseFloat(n)||0).toLocaleString('en-NG',{minimumFractionDigits:2});}}
function formatDate(d){if(!d)return '-';try{return new Date(d).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return d;}}
function showToast(m,err){var t=$('toast');t.textContent=m;t.className='toast'+(err?' error':'');t.style.display='block';setTimeout(function(){t.style.display='none';},3000);}
function navigateTo(p){window.location.href=p;}

function getPaymentLabel(m){if(!m)return 'Cash';var map={cash:'Cash',store_account:'Store Account',card:'Card',pos:'POS',bank_transfer:'Bank Transfer',giftcard:'Gift Card'};return map[m]||m;}

function renderReceipt(r){
  currentSaleId = (r && r.sale_id != null && /^\d+$/.test(String(r.sale_id))) ? String(r.sale_id) : null;
  if(!r){
    $('receiptContainer').innerHTML='<div class="no-receipt"><i class="fas fa-file-invoice"></i><h3>No Receipt Found</h3><p>There is no recent receipt to display. Complete a sale to generate a receipt.</p><div class="no-receipt-actions"><button class="btn btn-primary" onclick="navigateTo(\'sales.html\')" style="padding:12px 24px;"><i class="fas fa-shopping-cart"></i> Go to Sales</button><button class="btn btn-outline" onclick="navigateTo(\'receipts.html\')" style="padding:12px 24px;margin-left:10px;"><i class="fas fa-search"></i> Lookup Receipts</button></div></div>';
    return;
  }
  try {
    var voidBadge = (r.status==='void') ? '<div class="void-badge"><i class="fas fa-ban"></i> THIS INVOICE HAS BEEN VOIDED</div>' : '';
    var returnedBadge = (r.status==='returned') ? '<div class="returned-badge"><i class="fas fa-rotate-left"></i> RETURNED / REFUNDED</div>' : '';
    var storeName=esc(r.business_name||StoreConfig.getPharmacyName()||'Shanks Shop Management');
    var storeAddress=esc(r.business_address||StoreConfig.get('storeAddress')||'');
    var storePhone=esc(StoreConfig.get('phoneNumber')||'');
    var footerText=esc(StoreConfig.get('footerText')||'Thank you for choosing Shanks Shop Management!');
    var receiptId=esc(r.receipt_number||r.sale_id||'POS-'+Date.now().toString().slice(-6));
    var date=formatDate(r.created_at);
    var cashier=esc(r.employee||'Cashier');
    var customer=esc(r.customer_name||'Walk-in');
    var pm=getPaymentLabel(r.payment_method);
    var cashReceived=parseFloat(r.cash_received)||0;
    var accountAmount=parseFloat(r.account_amount)||0;
    var changeDue=parseFloat(r.change_due)||0;
    var subtotal=parseFloat(r.subtotal)||0;
    var discount=parseFloat(r.discount_amount)||0;
    var tax=parseFloat(r.tax_amount)||0;
    var total=parseFloat(r.total)||0;
    var items=r.items||[];
    var comments=esc(r.comments||r.notes||'');
    var loyaltyEarned=Math.floor(total/1000);
    var loyaltyHtml='';
    if(r.customer_id && loyaltyEarned>0){
      loyaltyHtml='<div class="loyalty-badge show"><span class="pts">+'+loyaltyEarned+' pts</span> Loyalty earned for '+customer+'</div>';
    }

    var html=voidBadge+returnedBadge+'<div class="receipt-card template-thermal" id="receiptCard">';
    html+='<div class="receipt-header"><img class="receipt-logo" src="brand-logo.png" alt="logo"><h1>'+storeName+'</h1>';
    if(storeAddress)html+='<p>'+storeAddress+'</p>';
    if(storePhone)html+='<p><i class="fas fa-phone" style="margin-right:6px;"></i>'+storePhone+'</p>';
    html+='<div class="qr-code" id="qrCode"></div><div class="qr-label">Scan for digital receipt</div>';
    html+='</div>';
    html+='<div class="receipt-body">';
    html+='<div class="receipt-meta">';
    html+='<div class="receipt-meta-box"><div class="label">Receipt No.</div><div class="value">'+receiptId+'</div></div>';
    html+='<div class="receipt-meta-box"><div class="label">Date & Time</div><div class="value">'+date+'</div></div>';
    html+='<div class="receipt-meta-box"><div class="label">Cashier</div><div class="value">'+cashier+'</div></div>';
    html+='<div class="receipt-meta-box"><div class="label">Customer</div><div class="value">'+customer+'</div></div>';
    html+='</div>';
    if(loyaltyHtml)html+='<div style="margin-bottom:16px;">'+loyaltyHtml+'</div>';
    html+='<div class="receipt-items"><div class="section-label">Items Purchased</div><h3 style="margin-bottom:8px;">Items Purchased</h3>';
    html+='<table class="items-table"><thead><tr><th style="width:40%">Item</th><th style="width:10%" class="col-qty">Qty</th><th style="width:16%" class="col-price">Unit Price</th><th style="width:20%" class="col-total">Total</th><th style="width:14%" class="col-pkg">Pkg</th></tr></thead><tbody>';
    items.forEach(function(it){
      var qty=parseFloat(it.qty)||0;
      var price=parseFloat(it.unit_price)||0;
      var disc=parseFloat(it.discount)||0;
      var lineTotal=(price*qty)-disc;
      var pkg=esc(it.pkg_type||it.pkgType||'pkt');
      html+='<tr><td class="col-name">'+esc(it.name||'Product')+'</td><td class="col-qty">'+qty+'</td><td class="col-price">'+fmt(price)+'</td><td class="col-total">'+fmt(lineTotal)+'</td><td class="col-pkg">'+pkg+'</td></tr>';
    });
    html+='</tbody></table></div>';
    html+='<div class="receipt-totals">';
    html+='<div class="total-row"><span class="label">Subtotal</span><span class="value">'+fmt(subtotal)+'</span></div>';
    if(discount>0)html+='<div class="total-row"><span class="label">Discount</span><span class="value">-'+fmt(discount)+'</span></div>';
    if(tax>0)html+='<div class="total-row"><span class="label">Tax</span><span class="value">'+fmt(tax)+'</span></div>';
    html+='<div class="total-row grand-total"><span class="label">Total</span><span class="value">'+fmt(total)+'</span></div>';
    html+='<div class="split-payments"><div class="label">Payment Breakdown</div>';
    html+='<div class="split-row"><span>Method</span><span>'+pm+'</span></div>';
    html+='<div class="split-row cash"><span>Cash Received</span><span>'+fmt(cashReceived)+'</span></div>';
    if(accountAmount>0)html+='<div class="split-row account"><span>Store Account</span><span>'+fmt(accountAmount)+'</span></div>';
    if(changeDue>0)html+='<div class="split-row change"><span>Change Due</span><span>'+fmt(changeDue)+'</span></div>';
    html+='</div>';
    html+='</div>';
    if(comments)html+='<div class="comment-box"><i class="fas fa-comment-dots" style="margin-right:6px;"></i><strong>Notes:</strong> '+comments+'</div>';
    html+='<div class="signature-section"><div class="label">Customer Signature</div><div class="signature-canvas" id="sigCanvas"><canvas id="sigCanvasEl"></canvas><div class="empty">Sign here (touch or click to draw)</div></div><div class="signature-actions"><button class="btn btn-outline" style="padding:9px 16px;font-size:13px;" onclick="clearSignature()"><i class="fas fa-eraser"></i> Clear</button><button class="btn btn-primary" style="padding:9px 16px;font-size:13px;" onclick="saveSignature()"><i class="fas fa-save"></i> Save Signature</button></div></div>';
    html+='<div class="receipt-footer"><div class="footer-text">'+footerText+'</div>';
    html+='<div class="footer-notes"><i class="fas fa-redo" style="margin-right:4px;"></i> Keep this receipt for returns and exchanges</div>';
    html+='</div>';
    html+='</div></div>';
    html+='<div class="templates-bar"><span class="section-label">Template:</span><button class="template-btn active" onclick="setTemplate(\'thermal\')">Thermal</button><button class="template-btn" onclick="setTemplate(\'invoice\')">Invoice</button><button class="template-btn" onclick="setTemplate(\'a4\')">A4</button></div>';
    html+='<div class="actions-bar">';
    html+='<button class="btn btn-primary" onclick="printCurrentReceipt()"><i class="fas fa-print"></i> Print Receipt</button>';
    html+='<button class="btn btn-outline" onclick="downloadPDF()"><i class="fas fa-file-pdf"></i> Download PDF</button>';
    html+='<button class="btn btn-edit" onclick="editInvoice()"><i class="fas fa-edit"></i> Edit Invoice</button>';
    html+='<button class="btn btn-warning" onclick="emailReceipt()"><i class="fas fa-envelope"></i> Email Receipt</button>';
    html+='<button class="btn btn-outline" style="background:#25d366;color:#fff;border-color:#25d366;" onclick="smsReceipt()"><i class="fab fa-whatsapp"></i> WhatsApp Receipt</button>';
    html+='<button class="btn btn-return" onclick="returnReceipt()"><i class="fas fa-rotate-left"></i> Return / Refund</button>';
    html+='<button class="btn btn-outline" onclick="navigateTo(\'sales.html\')"><i class="fas fa-shopping-cart"></i> New Sale</button>';
    html+='</div>';
    $('receiptContainer').innerHTML=html;
    setTimeout(initSignatureCanvas, 100);
    setTimeout(renderQR, 200);
  } catch(e) {
    showToast('Error rendering receipt: '+(e.message||'unknown error'), true);
    console.error('Receipt render error:', e);
  }
}

function renderQR(){
  try{
    var el=document.getElementById('qrCode');
    if(!el||!currentReceipt)return;
    var url=window.location.origin+'/receipt.html?id='+(currentReceipt.sale_id||'');
    QRCode.toCanvas(el, url, {width:92, margin:2, color:{dark:'#0f172a', light:'#fff'}}, function(err){
      if(err)console.error('QR error', err);
    });
  }catch(e){console.error('QR render failed', e);}
}

function initSignatureCanvas(){
  var c=document.getElementById('sigCanvasEl');
  if(!c)return;
  canvas=c;
  ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth||300;
  canvas.height=canvas.offsetHeight||150;
  ctx.lineWidth=2;
  ctx.lineCap='round';
  ctx.strokeStyle='#000';
  function start(e){isDrawing=true;var pos=getPos(e);ctx.beginPath();ctx.moveTo(pos.x,pos.y);}
  function draw(e){if(!isDrawing)return;var pos=getPos(e);ctx.lineTo(pos.x,pos.y);ctx.stroke();}
  function end(){isDrawing=false;signatureData=canvas.toDataURL();}
  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',draw);
  canvas.addEventListener('mouseup',end);
  canvas.addEventListener('mouseout',end);
  canvas.addEventListener('touchstart',function(e){e.preventDefault();start(e.touches[0]);},{passive:false});
  canvas.addEventListener('touchmove',function(e){e.preventDefault();draw(e.touches[0]);},{passive:false});
  canvas.addEventListener('touchend',function(e){e.preventDefault();end();});
}
function getPos(e){var rect=canvas.getBoundingClientRect();return{x:e.clientX-rect.left,y:e.clientY-rect.top};}
function clearSignature(){if(!ctx)return;ctx.clearRect(0,0,canvas.width,canvas.height);signatureData=null;}
function saveSignature(){
  if(!signatureData){showToast('Please draw a signature first',true);return;}
  if(!currentSaleId){showToast('No sale ID to attach signature to',true);return;}
  API.post('/sales/'+currentSaleId+'/signature',{signature:signatureData}).then(function(){
    showToast('Signature saved');
  }).catch(function(e){showToast('Failed to save signature: '+(e.message||'error'),true);});
}

function printCurrentReceipt(){

    var storeName=currentReceipt.business_name||StoreConfig.getPharmacyName()||'Shanks Shop Management';
    var storeAddress=currentReceipt.business_address||StoreConfig.get('storeAddress')||'';

    var footerText=StoreConfig.get('footerText')||'Thank you for choosing Shanks Shop Management!';

    var tax=parseFloat(currentReceipt.tax_amount)||0;

    var comments=currentReceipt.comments||currentReceipt.notes||'';
    var printHtml='<!DOCTYPE html><html><head><title>Receipt - '+esc(storeName)+'</title><style>@page{size:80mm auto;margin:0;}*,::before,::after{box-sizing:border-box}body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:12px;color:#111827;margin:0;padding:0;background:#fff;-webkit-font-smoothing:antialiased}.r-wrap{max-width:80mm;margin:0 auto;padding:14px 16px;}.r-header{text-align:center;padding-bottom:14px;border-bottom:2px dashed #000;margin-bottom:14px;}.r-header img{width:44px;height:44px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid #e5e7eb;padding:5px;margin-bottom:10px;}.r-header h1{font-size:18px;font-weight:900;margin:0;text-transform:uppercase;letter-spacing:.04em;}.r-header p{margin:2px 0;font-size:9.5px;color:#374151;line-height:1.4;}.r-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:14px;font-size:11px;color:#4b5563;}.r-meta div{padding:2px 0;}.r-meta strong{color:#111827;}.r-section{margin-bottom:14px;}.r-section h3{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:#374151;border-bottom:1px dashed #000;padding-bottom:4px;margin-bottom:6px;}table{width:100%;border-collapse:collapse;font-size:12px;}th{text-align:left;padding:5px 0;font-size:10px;font-weight:800;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #000;}td{padding:5px 0;border-bottom:1px solid #f3f4f6;vertical-align:middle;}.td-name{font-weight:700;color:#111827;}.td-meta{font-size:10px;color:#6b7280;display:block;margin-top:1px;}.td-qty{text-align:center;font-variant-numeric:tabular-nums;font-weight:700;color:#4b5563;}.td-price,.td-total{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:#111827;}.r-totals{border-top:2px dashed #000;padding-top:10px;margin-top:10px;}.r-total-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;color:#374151;}.r-total-row.grand{font-size:16px;font-weight:900;color:#111827;border-top:1px solid #000;padding-top:8px;margin-top:6px;}.r-discount{color:#b91c1c;font-size:11px;}.r-payment{margin-top:14px;padding-top:10px;border-top:1px dashed #9ca3af;}.r-payment-row{display:flex;justify-content:space-between;padding:3px 0;font-size:11.5px;color:#374151;}.r-payment-row strong{color:#111827;}.r-footer{text-align:center;margin-top:16px;padding-top:12px;border-top:2px dashed #000;font-size:10px;color:#6b7280;line-height:1.5;}</style></head><body><div class="r-wrap">';
    printHtml+='<div class="r-header"><img src="'+logoUrl+'" alt="logo"><h1>'+esc(storeName)+'</h1>';
    if(storeAddress)printHtml+='<p>'+esc(storeAddress)+'</p>';
    if(storePhone)printHtml+='<p><strong>Phone:</strong> '+esc(storePhone)+'</p>';
    printHtml+='</div>';
    printHtml+='<div class="r-meta"><div><strong>Receipt:</strong> '+receiptId+'</div><div><strong>Date:</strong> '+date+'</div><div><strong>Cashier:</strong> '+esc(cashier)+'</div><div><strong>Customer:</strong> '+esc(customer)+'</div></div>';
    printHtml+='<div class="r-section"><h3>Items Purchased</h3><table><thead><tr><th style="width:48%">Item</th><th style="width:10%">Qty</th><th style="width:16%">Unit Price</th><th style="width:26%">Total</th></tr></thead><tbody>';
    items.forEach(function(it){
      var qty=parseFloat(it.qty)||0;
      var price=parseFloat(it.unit_price)||0;
      var disc=parseFloat(it.discount)||0;
      var lineTotal=(price*qty)-disc;
      printHtml+='<tr><td class="td-name">'+esc(it.name||'Product')+'<span class="td-meta">'+qty+' x '+fmt(price)+'</span></td><td class="td-qty">'+qty+'</td><td class="td-price">'+fmt(price)+'</td><td class="td-total">'+fmt(lineTotal)+'</td></tr>';
      if(disc>0){printHtml+='<tr><td colspan="4" style="padding:3px 0;font-size:10px;color:#b91c1c;font-weight:700;">Discount: -'+fmt(disc)+'</td></tr>';}
    });
    printHtml+='</tbody></table></div>';
    printHtml+='<div class="r-totals"><div class="r-total-row"><span>Subtotal</span><span>'+fmt(subtotal)+'</span></div>';
    if(discount>0)printHtml+='<div class="r-total-row r-discount"><span>Discount</span><span>-'+fmt(discount)+'</span></div>';
    if(tax>0)printHtml+='<div class="r-total-row"><span>Tax</span><span>'+fmt(tax)+'</span></div>';
    printHtml+='<div class="r-total-row grand"><span>Total</span><span>'+fmt(total)+'</span></div>';
    printHtml+='</div>';
    printHtml+='<div class="r-payment"><div class="r-payment-row"><strong>Method</strong><span>'+pm+'</span></div><div class="r-payment-row"><strong>Amount Paid</strong><span>'+fmt(pm==='Store Account'?total:cashReceived)+'</span></div>';
    if(changeDue>0)printHtml+='<div class="r-payment-row"><strong>Change Due</strong><span>'+fmt(changeDue)+'</span></div>';
    if(accountAmount>0)printHtml+='<div class="r-payment-row"><strong>Store Account</strong><span>'+fmt(accountAmount)+'</span></div>';
    printHtml+='</div>';
    if(comments)printHtml+='<div style="margin-top:10px;font-size:10.5px;color:#6b7280;border-top:1px dashed #ccc;padding-top:6px;"><strong>Notes:</strong> '+esc(comments)+'</div>';
    printHtml+='<div class="r-footer"><p>'+esc(footerText)+'</p><p style="margin-top:6px;font-size:9px;">Keep this receipt for returns and exchanges</p></div>';
    printHtml+='</div></body></html>';
    w.document.write(printHtml);
    w.document.close();
    setTimeout(function(){try{w.focus();w.print();setTimeout(function(){try{w.close();}catch(e){}},1000);}catch(e){showToast('Print dialog blocked by browser. Use Ctrl+P instead.',true);}},300);
  } catch(e) {

function downloadPDF(){
  if(!currentReceipt){showToast('No receipt data to download.',true);return;}
  showToast('PDF download requires browser print-to-PDF. Use Print Receipt then select "Save as PDF".',true);
}

function emailReceipt(){
  if(!currentReceipt){showToast('No receipt data.',true);return;}
  var email=prompt('Enter customer email address:');
  if(!email)return;
  API.post('/sales/'+currentSaleId+'/email',{email:email}).then(function(res){
    showToast(res.message||'Receipt emailed');
  }).catch(function(e){showToast('Email failed: '+(e.message||'error'),true);});
}

function smsReceipt(){
  if(!currentReceipt){showToast('No receipt data.',true);return;}
  var phone=prompt('Enter customer phone number (WhatsApp/SMS):');
  if(!phone)return;
  API.post('/sales/'+currentSaleId+'/sms',{phone:phone,channel:'whatsapp'}).then(function(res){
    showToast(res.message||'Receipt sent via WhatsApp');
  }).catch(function(e){showToast('Send failed: '+(e.message||'error'),true);});
}

function returnReceipt(){
  if(!currentSaleId){showToast('No sale to return.',true);return;}
  if(currentReceipt && currentReceipt.status==='returned'){showToast('Already returned',true);return;}
  if(currentReceipt && currentReceipt.status==='void'){showToast('Cannot return a voided sale',true);return;}
  var reason=prompt('Return reason:');
  if(!reason)return;
  API.post('/sales/'+currentSaleId+'/return',{reason:reason}).then(function(){
    showToast('Sale returned / refunded');
    currentReceipt.status='returned';
    renderReceipt(currentReceipt);
  }).catch(function(e){showToast('Return failed: '+(e.message||'error'),true);});
}

function editInvoice(){
  if(!currentSaleId){showToast('This receipt was not saved to the server, so it cannot be edited online.',true);return;}
  navigateTo('sales.html?edit='+currentSaleId);
}

function voidInvoice(){
  if(!currentSaleId){showToast('This receipt was not saved to the server, so it cannot be voided.',true);return;}
  if(currentReceipt && currentReceipt.status==='void'){showToast('Invoice already voided',true);return;}
  if(!confirm('Void this invoice? Stock and customer balance will be reversed, and the sale excluded from reports.'))return;
  API.post('/sales/'+currentSaleId+'/void',{}).then(function(){
    currentReceipt=currentReceipt||{};currentReceipt.status='void';
    try{localStorage.setItem('last_receipt',JSON.stringify(currentReceipt));}catch(e){}
    renderReceipt(currentReceipt);
    showToast('Invoice voided');
  }).catch(function(e){showToast('Void failed: '+(e.message||'error'),true);});
}

function loadReceipt(){
  try{currentReceipt=JSON.parse(localStorage.getItem('last_receipt')||'null');}catch(e){currentReceipt=null;}
  renderReceipt(currentReceipt);
}

function setTemplate(t){
  var card=document.getElementById('receiptCard');
  if(card){
    card.className='receipt-card template-'+t;
  }
  document.querySelectorAll('.template-btn').forEach(function(b){b.classList.remove('active');});
  var activeBtn=document.querySelector('.template-btn[onclick="setTemplate(\''+t+'\')"]');
  if(activeBtn)activeBtn.classList.add('active');
  showToast('Template set to '+t);
}

document.addEventListener('DOMContentLoaded',function(){
  POS.initCommon();
  loadReceipt();
  if(new URLSearchParams(window.location.search).get('print')==='1'){
    setTimeout(function(){ if(currentReceipt) printCurrentReceipt(); }, 400);
  }
  var idParam=new URLSearchParams(window.location.search).get('id');
  if(idParam&&!currentReceipt){
    API.get('/sales/'+idParam).then(function(s){currentReceipt=s;renderReceipt(s);}).catch(function(){});
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Log - SHANKS SHOP MANAGEMENT</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.png" type="image/png" sizes="512x512">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.date-bar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.date-bar .form-group{margin:0}
.timeline{position:relative;padding-left:22px}
.timeline:before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:#e5e7eb}
.tl-item{position:relative;padding:0 0 18px 14px}
.tl-item:before{content:'';position:absolute;left:-18px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px #ecfdf5}
.tl-item.void:before{background:var(--danger);box-shadow:0 0 0 3px #fef2f2}
.tl-action{font-weight:800;color:#111827;font-size:14px}
.tl-meta{font-size:12px;color:var(--muted);margin-top:2px}
.tl-details{margin-top:6px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;color:#475569;white-space:pre-wrap;font-family:'IBM Plex Mono',monospace}
.empty-state{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="sidebar" id="sidebar"></div>
<div class="main-content">
  <div class="header"><h2><i class="fas fa-clipboard-list"></i> Audit Log</h2><div id="userMenu"></div><div class="header-clock" id="topClock"></div></div>
  <div class="content">
    <div class="date-bar">
      <div class="form-group"><label class="form-group label" style="font-size:12px;font-weight:850;color:#475569;">Date</label><input type="date" id="filterDate" class="form-control" style="width:auto;"></div>
      <button class="btn btn-primary" onclick="loadAudit()"><i class="fas fa-sync-alt"></i> Load</button>
      <button class="btn btn-outline" onclick="setToday()"><i class="fas fa-calendar-day"></i> Today</button>
    </div>
    <div class="panel">
      <div class="table-top"><div><strong><i class="fas fa-history"></i> Invoice Changes &amp; Voids</strong> <span id="countLabel" style="margin-left:8px;"></span></div></div>
      <div id="auditBody"><div class="empty-state">Loading…</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
function $(id){return document.getElementById(id);}
function fmt(n){try{return StoreConfig.formatCurrency(n);}catch(e){return '₦'+(parseFloat(n)||0).toLocaleString('en-NG',{minimumFractionDigits:2});}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function showToast(m,err){var t=$('toast');t.textContent=m;t.className='toast'+(err?' error':'');t.style.display='block';setTimeout(function(){t.style.display='none';},3000);}
function setToday(){$('filterDate').value=POS.today();loadAudit();}
function loadAudit(){
  var body=$('auditBody');
  body.innerHTML='<div class="empty-state">Loading…</div>';
  API.get('/audit').then(function(list){
    list=list||[];
    var dateFilter=$('filterDate').value;
    if(dateFilter) list=list.filter(function(a){return (a.created_at||'').indexOf(dateFilter)===0;});
    $('countLabel').textContent=list.length+' entr'+(list.length===1?'y':'ies');
    if(!list.length){body.innerHTML='<div class="empty-state">No audit entries found.</div>';return;}
    body.innerHTML='<div class="timeline">'+list.map(function(a){
      var d=a.details?safeParse(a.details):{};
      var html='<div class="tl-item '+(a.action==='void_sale'?'void':'')+'">';
      html+='<div class="tl-action">'+(a.action==='void_sale'?'Invoice Voided':'Invoice Edited')+' #'+(a.entity_id||'-')+'</div>';
      html+='<div class="tl-meta">'+(a.created_at||'')+' &middot; by '+(a.user||'system')+'</div>';
      html+='<div class="tl-details">'+esc(formatDetails(d))+'</div>';
      html+='</div>';
      return html;
    }).join('')+'</div>';
  }).catch(function(e){body.innerHTML='<div class="empty-state">Failed to load audit: '+(e.message||'error')+'</div>';});
}
function safeParse(s){try{return JSON.parse(s);}catch(e){return {};}}
function formatDetails(d){
  if(d.old_total!=null||d.new_total!=null){
    return 'Total: '+fmt(d.old_total)+'  ->  '+fmt(d.new_total)+'\n'+
           'Customer: '+(d.old_customer||'-')+'  ->  '+(d.new_customer||'-')+'\n'+
           'Payment: '+(d.old_payment||'-')+'  ->  '+(d.new_payment||'-');
  }
  if(d.total!=null) return 'Total: '+fmt(d.total)+'\nCustomer: '+(d.customer||'-')+'\nPayment: '+(d.payment||'-');
  return JSON.stringify(d);
}
document.addEventListener('DOMContentLoaded',function(){
  if(!POS.requireAuth()) return;
  POS.initCommon();
  setToday();
});
</script>
</body>
</html>
